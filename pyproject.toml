[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-source-collector"
version = "0.1.0"
description = "A traceable, list-only public technology news collector"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "feedparser>=6.0.11,<7",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "jinja2>=3.1,<4",
  "cryptography>=43,<51",
  "keyring>=25,<26",
  "httpx2>=2,<3",
  "itsdangerous>=2.2,<3",
  "playwright>=1.55,<2",
]

[project.optional-dependencies]
# Disabled by default: this adds a heavier browser-assisted public-detail
# cleaner, while normal scheduled collection remains list-only.
detail-enrichment = [
  "crawl4ai>=0.9,<1",
]

[project.scripts]
public-source-collector = "wechat_list_collector.cli:main"
# Compatibility command for existing local installations. New documentation and
# launchd files use public-source-collector.
wechat-list-collector = "wechat_list_collector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
